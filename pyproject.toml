[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "policyhub"
version = "0.1.0"
description = "Evaluate, package and publish robot policies to Hugging Face, one family at a time"
requires-python = ">=3.10"
# mjlab, torch and the training repo's own tasks come from the training repo's environment:
# policyhub is installed into it (uv add --dev) and never pins them.
dependencies = ["onnx>=1.16", "onnxruntime>=1.18", "huggingface_hub>=0.27", "pyyaml>=6"]

[project.scripts]
policyhub = "policyhub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["policyhub"]

[tool.hatch.build.targets.wheel.force-include]
"families" = "policyhub/families"
"SPEC.md" = "policyhub/SPEC.md"
